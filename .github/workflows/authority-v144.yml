name: REDLINE Stages 141-144 Prototype CI
on:
  push:
    branches: [stages-141-144-netcode]
  pull_request:
    paths: ['prototypes/authority-v140/**', '.github/workflows/authority-v144.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: prototypes/authority-v140
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install HTTP and WebSocket dependency
        run: python -m pip install -r requirements.txt
      - name: JavaScript syntax
        run: |
          for f in *.cjs *.js; do node --check "$f"; done
      - name: Authoritative simulation
        run: node test_world.cjs
      - name: Collision and reconciliation fixtures
        run: node test_collision_netcode.cjs
      - name: Real WebSocket transport and reconnect
        run: python test_network.py
      - name: Gateway lifecycle and identity
        run: python test_gateway.py
