name: REDLINE One Shared World v145
on:
  push:
    branches: [v145-single-authoritative-world]
  pull_request:
    branches: [stages-141-144-netcode]
jobs:
  authority:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gateway requirements
        run: pip install -r releases/shared-world-v145/authority/requirements.txt
      - name: Syntax checks
        run: |
          python -m py_compile releases/shared-world-v145/authority/server.py releases/shared-world-v145/authority/test_network.py releases/shared-world-v145/authority/test_shared_world.py releases/shared-world-v145/patch_v139_single_world.py
          node --check releases/shared-world-v145/authority/worker.cjs
          node --check releases/shared-world-v145/authority/world.cjs
          node --check releases/shared-world-v145/site/shared_world_client.js
      - name: Two-course authoritative server fixture
        working-directory: releases/shared-world-v145/authority
        env:
          REDLINE_REQUIRE_AUTH: '0'
        run: |
          node test_world.cjs
          python test_network.py
          python test_shared_world.py
