name: REDLINE v147 exact source recovery
on:
  push:
    branches: [v147-render-authority]
    paths: ['.github/workflows/redline-v147-recover.yml','releases/shared-world-v147/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: redline-v147-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Recover verified original and bake both maps
        working-directory: releases/shared-world-v147
        run: |
          if [ ! -f authority/collision_exports/grand.f32.gz ] || [ ! -f authority/collision_exports/iron.f32.gz ]; then
            python -m pip install playwright==1.52.0
            python -m playwright install --with-deps chromium
            python recover_bakes.py
          fi
          echo '836bbd9b886168699661fe14b9452cd0693c24f54e2db2fe96cab9575e4198eb  original/index.html' | sha256sum -c
          echo '4d8115faea7575e2cef2a27a3fa76d0d8d66d44e65ba67c6acd24d1ec2f4022a  original/iron-tide.pack' | sha256sum -c
      - name: Verify complete server
        working-directory: releases/shared-world-v147/authority
        run: |
          python -m pip install -r requirements.txt
          REDLINE_COLLISION_STRICT=1 node test_collision.cjs
          REDLINE_COLLISION_STRICT=1 node test_world.cjs
          REDLINE_COLLISION_STRICT=1 node test_delorean.cjs
          REDLINE_COLLISION_STRICT=1 node test_frost.cjs
          REDLINE_REQUIRE_AUTH=0 REDLINE_COLLISION_STRICT=1 python test_network.py
          REDLINE_REQUIRE_AUTH=0 REDLINE_COLLISION_STRICT=1 python test_shared_world.py
          REDLINE_REQUIRE_AUTH=0 REDLINE_COLLISION_STRICT=1 python test_readiness.py
      - name: Commit verified assets to deployment branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f releases/shared-world-v147/original releases/shared-world-v147/authority/collision_exports
          if ! git diff --cached --quiet; then
            git commit -m "REDLINE v147 exact Vercel source and baked collision archives"
            git pull --rebase origin v147-render-authority
            git push origin HEAD:v147-render-authority
          fi
