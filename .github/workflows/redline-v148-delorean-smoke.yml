name: REDLINE v148 DeLorean public smoke
on:
  push:
    branches: [v147-render-authority]
    paths: ['.github/workflows/redline-v148-delorean-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Public HTTPS, authenticated WSS and shared-world checks
        env:
          AUTHORITY_ORIGIN: https://redline-shared-authority.onrender.com
          SITE_ORIGIN: https://redlin3.vercel.app
        run: |
          python -m pip install aiohttp==3.13.3
          python - <<'PY'
          import asyncio, json, os, re, time
          from pathlib import Path
          from aiohttp import ClientSession, ClientTimeout, WSMsgType
          BASE=os.environ['AUTHORITY_ORIGIN']
          ORIGIN=os.environ['SITE_ORIGIN']
          ROOT=Path('releases/shared-world-v147')
          source=(ROOT/'original/index.html').read_text()
          key=re.search(r"const REDLINE_ONLINE=\(\(\)=>\{\s*const URL='[^']+';\s*const KEY='([^']+)'",source).group(1)
          SB='https://gudzbisvhrvmduvbtcrh.supabase.co'
          hashes={c:json.loads((ROOT/'authority/collision_exports'/f'{c}.json').read_text())['float32_sha256'] for c in ('grand','iron')}
          async def rpc(s,name,args):
              async with s.post(SB+'/rest/v1/rpc/'+name,json=args,headers={'apikey':key,'Accept':'application/json'}) as r:
                  if r.status!=200: raise RuntimeError(f'{name} HTTP {r.status}')
                  return await r.json()
          async def receive(ws,typ,pred=lambda m:True):
              async with asyncio.timeout(18):
                  while True:
                      m=await ws.receive()
                      if m.type!=WSMsgType.TEXT: raise RuntimeError('socket closed before '+typ)
                      d=json.loads(m.data)
                      if d.get('type')=='error':raise RuntimeError('authority rejected '+typ+': '+str(d.get('message','error'))[:160])
                      if d.get('type')==typ and pred(d):return d
          async def main():
              async with ClientSession(timeout=ClientTimeout(total=30)) as s:
                  deadline=time.monotonic()+220
                  while True:
                      try:
                          async with s.get(BASE+'/health',headers={'Origin':ORIGIN}) as r:
                              d=await r.json(content_type=None)
                              if r.status==200 and d.get('ok') and d.get('authenticated') and d.get('maps')==hashes and d.get('version')==147 and d.get('protocol')==145 and 'delorean' in d.get('airframes',[]):
                                  assert r.headers.get('Access-Control-Allow-Origin')==ORIGIN
                                  print('PUBLIC_HEALTH_PASS',json.dumps(d),flush=True)
                                  break
                      except Exception: pass
                      if time.monotonic()>deadline:raise RuntimeError('public authenticated map readiness deadline exceeded')
                      await asyncio.sleep(4)
                  async with s.ws_connect(BASE+'/ws',origin=ORIGIN) as ws:
                      await ws.send_json({'op':'join','room':'NOACCESS00','course':'grand','id':'00000000-0000-0000-0000-000000000000','secret':'not-valid','model':'kestrel'})
                      msg=await ws.receive_json(timeout=12)
                      assert msg['type']=='error'
                  print('INVALID_MEMBERSHIP_REJECTED',flush=True)
                  for course in ('grand','iron'):
                      credentials=[]
                      sockets=[]
                      try:
                          a=await rpc(s,'redline_create_room_v137',{'p_name':'QA-Pilot-A','p_skin':0,'p_course':course})
                          credentials.append({'p_code':a['room']['code'],'p_id':a['id'],'p_secret':a['secret']})
                          b=await rpc(s,'redline_join_room_v137',{'p_code':a['room']['code'],'p_name':'QA-Pilot-B','p_skin':0})
                          credentials.append({'p_code':b['room']['code'],'p_id':b['id'],'p_secret':b['secret']})
                          await rpc(s,'redline_lobby_model_v125',{**credentials[0],'p_model':'delorean'})
                          for j,cred in enumerate(credentials):
                              ws=await s.ws_connect(BASE+'/ws',origin=ORIGIN,heartbeat=15)
                              sockets.append(ws)
                              await ws.send_json({'op':'join','room':cred['p_code'],'id':cred['p_id'],'secret':cred['p_secret'],'course':course,'name':f'QA-Pilot-{j}','model':'delorean' if j==0 else 'kestrel'})
                          joined=await asyncio.gather(*(receive(ws,'joined') for ws in sockets))
                          assert joined[0]['world']==joined[1]['world'] and joined[0]['id']!=joined[1]['id'] and joined[0]['host'] and not joined[1]['host']
                          for cred in credentials:await rpc(s,'redline_set_ready',{**cred,'p_ready':True})
                          before=await receive(sockets[0],'snapshot',lambda m:len(m['players'])==2)
                          assert before['collisionHash']==hashes[course]
                          assert next(x for x in before['players'] if x['id']==joined[0]['id'])['model']=='delorean'
                          await sockets[0].send_json({'op':'start'})
                          await receive(sockets[0],'started')
                          await receive(sockets[0],'snapshot',lambda m:m['startTick'] is not None and m['tick']>m['startTick']+2)
                          for seq in range(1,31):
                              await sockets[0].send_json({'op':'input','input':{'seq':seq,'throttle':1,'lift':0.5,'p':[999999,999999,999999]}})
                              await sockets[1].send_json({'op':'input','input':{'seq':seq,'strafe':1,'lift':1,'shield':True}})
                              await asyncio.sleep(.045)
                          snaps=await asyncio.gather(*(receive(ws,'snapshot',lambda m:len(m['players'])==2 and all(p['ack']==30 for p in m['players'])) for ws in sockets))
                          for snap in snaps:
                              assert snap['world']==joined[0]['world'] and snap['collisionHash']==hashes[course]
                              for p in snap['players']:
                                  old=next(x for x in before['players'] if x['id']==p['id'])
                                  assert p['p']!=old['p'] and max(abs(x) for x in p['p'])<1500
                          await sockets[0].send_json({'op':'input','input':{'seq':1,'throttle':-1}})
                          after=await receive(sockets[1],'snapshot',lambda m:m['tick']>snaps[1]['tick']+3)
                          assert next(x for x in after['players'] if x['id']==joined[0]['id'])['ack']==30
                          await sockets[0].close()
                          await receive(sockets[1],'snapshot',lambda m:any(p['id']==joined[0]['id'] and not p['connected'] for p in m['players']))
                          re=await s.ws_connect(BASE+'/ws',origin=ORIGIN)
                          sockets.append(re)
                          c=credentials[0]
                          await re.send_json({'op':'join','room':c['p_code'],'id':c['p_id'],'secret':c['p_secret'],'course':course,'name':'QA-Pilot-A','model':'delorean','token':joined[0]['token']})
                          back=await receive(re,'joined')
                          assert back['world']==joined[0]['world'] and back['id']==joined[0]['id'] and back['ack']==30
                          print('PUBLIC_COURSE_PASS',course,'same world, two authenticated clients, movement, forged pose ignored, stale input ignored, reconnect',flush=True)
                      finally:
                          for ws in sockets:await ws.close()
                          for cred in reversed(credentials):
                              try:await rpc(s,'redline_leave_room',cred)
                              except Exception:print('QA room leave failed; lease expires automatically',flush=True)
                  print('PUBLIC_DELOREAN_WSS_PASS both courses',flush=True)
          asyncio.run(main())
          PY
