name: REDLINE Stage 1 - Real Browser QA
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      REDLINE_REQUIRE_VENDOR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install pinned renderer and browser QA tools
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          pip install Pillow playwright
          python -m playwright install --with-deps chromium
      - name: Restore large source assets exactly
        run: python tools_restore_sources.py
      - name: Restore and verify frozen v77 baseline
        run: python tools_restore_baseline.py
      - name: Build self-contained game and modular site
        run: python build.py
      - name: Validate all four game assets
        run: python tools_validate.py
      - name: Source and runtime tests
        run: |
          python tests/test_stage1.py
          node tests/test_stage1_runtime.js
          for f in tests/legacy/*.js; do node "$f"; done
      - name: Chromium HUD layout tests
        run: python tests/browser_ui.py
      - name: Real WebGL startup and flight
        run: python tests/full_game_e2e.py
      - name: Raven Slalom real WebGL benchmark
        run: python tests/benchmark_sector.py
      - name: Upload visual and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redline-stage1-qa
          path: qa/
          retention-days: 14
