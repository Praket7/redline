name: REDLINE v155 authenticated public smoke
on:
  push:
    branches: [v147-render-authority]
    paths: ['.github/workflows/redline-v155-public-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install aiohttp==3.13.3
      - name: Verify public variant, AI and reconnect
        run: |
          python - <<'PY'
          import asyncio,json,re
          from pathlib import Path
          from aiohttp import ClientSession,ClientTimeout,WSMsgType
          BASE='https://redline-shared-authority.onrender.com'
          ORIGIN='https://redlin3.vercel.app'
          SB='https://gudzbisvhrvmduvbtcrh.supabase.co'
          source=Path('releases/shared-world-v147/original/index.html').read_text()
          key=re.search(r"const REDLINE_ONLINE=\(\(\)=>\{\s*const URL='[^']+';\s*const KEY='([^']+)'",source).group(1)
          async def rpc(s,name,args):
              async with s.post(SB+'/rest/v1/rpc/'+name,json=args,headers={'apikey':key,'Accept':'application/json'}) as r:
                  if r.status!=200: raise RuntimeError(f'{name} HTTP {r.status}')
                  return await r.json()
          async def recv(ws,typ,pred=lambda d:True):
              async with asyncio.timeout(25):
                  while True:
                      m=await ws.receive()
                      if m.type!=WSMsgType.TEXT: raise RuntimeError('closed before '+typ)
                      d=json.loads(m.data)
                      if d.get('type')=='error' and typ!='error':raise RuntimeError(d.get('message'))
                      if d.get('type')==typ and pred(d):return d
          async def main():
              async with ClientSession(timeout=ClientTimeout(total=45)) as s:
                  for endpoint in ['health','health153']:
                      async with s.get(BASE+'/'+endpoint,headers={'Origin':ORIGIN}) as r:
                          d=await r.json()
                          assert d['ok'] and d['authenticated'] and len(d['maps'])==3
                          assert r.headers.get('Access-Control-Allow-Origin')==ORIGIN
                          if endpoint=='health153': assert d['release']==155 and d['bots'] and d['formats']
                  for course,fmt,total in [('grand','entry',4),('iron','dock',7),('frost','ascent',9)]:
                      cs=[];ws=[]
                      try:
                          a=await rpc(s,'redline_create_room_v150',{'p_name':'QA155-A','p_skin':0,'p_course':course})
                          cs.append({'p_code':a['room']['code'],'p_id':a['id'],'p_secret':a['secret']})
                          b=await rpc(s,'redline_join_room_v150',{'p_code':a['room']['code'],'p_name':'QA155-B','p_skin':0})
                          cs.append({'p_code':b['room']['code'],'p_id':b['id'],'p_secret':b['secret']})
                          async def join(c,token=None):
                              w=await s.ws_connect(BASE+'/ws',origin=ORIGIN,heartbeat=15)
                              ws.append(w)
                              await w.send_json({'op':'join','room':c['p_code'],'id':c['p_id'],'secret':c['p_secret'],'course':course,'physicsRevision':153,'release':155,'token':token})
                              return w,await recv(w,'joined')
                          x,j=await join(cs[0]);y,k=await join(cs[1])
                          assert j['world']==k['world'] and j['host'] and not k['host']
                          for c in cs:await rpc(s,'redline_set_ready',{**c,'p_ready':True})
                          await y.send_json({'op':'start','format':fmt,'bots':1})
                          await recv(y,'error')
                          await x.send_json({'op':'start','format':fmt,'bots':1,'difficulty':'club'})
                          await recv(x,'started')
                          v=await recv(y,'snapshot',lambda d:d.get('startTick') is not None and d['tick']>d['startTick'])
                          assert v['format']==fmt and v['gateTotal']==total and len(v['players'])==3
                          ai=next(p for p in v['players'] if p.get('bot'))
                          for seq in range(1,16):
                              await x.send_json({'op':'input','input':{'seq':seq,'throttle':.5,'lift':.5}})
                              await asyncio.sleep(.035)
                          v=await recv(y,'snapshot',lambda d:next(p for p in d['players'] if p['id']==j['id'])['ack']==15)
                          assert next(p for p in v['players'] if p['id']==ai['id'])['p']!=ai['p']
                          z,h=await join(cs[1],k['token'])
                          assert h['world']==k['world'] and h['id']==k['id']
                          print('PUBLIC_V155_PASS',course,fmt,'authenticated variant and physical bot movement, host lock, reconnect',flush=True)
                      finally:
                          for w in ws:await w.close()
                          for c in reversed(cs):
                              try:await rpc(s,'redline_leave_room',c)
                              except Exception:print('QA cleanup deferred to expiry',flush=True)
                  print('PUBLIC_V155_ALL_THREE_PASS',flush=True)
          asyncio.run(main())
          PY
