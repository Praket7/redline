name: REDLINE v81 fullscreen-controls-minimal-FPV browser QA
on:
  push:
    branches: [fix/v81-viewport-input-fpv]
  workflow_dispatch:
concurrency:
  group: redline-v81-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  real_webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned renderer, image QA and real Chromium
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          pip install Pillow playwright
          python -m playwright install --with-deps chromium
      - name: Verify and restore original source, four GLBs and cockpit assets
        run: |
          python tools_restore_sources.py
          python tools_restore_baseline.py
          python tools_validate.py
      - name: Build exact lightweight modern-Three v81 standalone and modular site
        env:
          REDLINE_THREE_VARIANT: r187
          REDLINE_COMPACT: '1'
          REDLINE_V81: '1'
          REDLINE_REQUIRE_VENDOR: '1'
        run: |
          node tools/build-modern-renderer.cjs
          python build.py
          ls -lh dist/REDLINE_v81_FULLSCREEN_COMBAT_MINIMAL_FPV.html
          python -m py_compile build.py
      - name: Verify v81 dedicated controls, crash timing, viewport and JS syntax
        run: |
          node tests/v81_controls_and_viewport.js
          node tests/v80_pitch_response.js
          node tests/test_stage1_runtime.js
          node tests/simulation_determinism.js
          for f in src/scripts/{006,012,019,035}_module.js; do node --check "$f"; done
      - name: Real Chromium WebGL four-aircraft racing / responsive fullscreen / FPV
        env:
          REDLINE_EXPECT_RENDERER: '187'
          REDLINE_COMPACT_SITE: '1'
          REDLINE_V81: '1'
        run: python tests/full_game_e2e.py
      - name: Real Chromium WebGL standalone HTML startup and flying
        env:
          REDLINE_EXPECT_RENDERER: '187'
          REDLINE_STANDALONE_FILE: REDLINE_v81_FULLSCREEN_COMBAT_MINIMAL_FPV.html
        run: python tests/standalone_smoke.py
      - name: Real Raven Slalom rendering smoke test
        env:
          REDLINE_EXPECT_RENDERER: '187'
          REDLINE_V81: '1'
        run: python tests/benchmark_sector.py
      - name: Export tested v81 game plus full screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: REDLINE-v81-fullscreen-controls-transparent-FPV
          path: |
            dist/REDLINE_v81_FULLSCREEN_COMBAT_MINIMAL_FPV.html
            dist/BUILD_V81_REPORT.json
            qa/
          compression-level: 0
          retention-days: 14
