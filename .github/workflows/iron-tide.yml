name: Iron Tide visual evidence
on:
  push:
    branches: ['feature/iron-tide-camera-lab']
    paths: ['iron-tide/**', 'tests/iron_tide_capture.py', '.github/workflows/iron-tide.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  camera-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: pip install playwright==1.51.0 Pillow==11.1.0
      - run: python -m playwright install --with-deps chromium
      - run: node --check iron-tide/world.js
      - run: python iron-tide/prepare_textures.py
      - run: python iron-tide/prepare_models.py
      - run: python iron-tide/package.py
      - run: python tests/iron_tide_capture.py --preview
      - uses: actions/upload-artifact@v4
        with:
          name: iron-tide-fast-preview
          path: |
            iron-tide-output/*.png
            iron-tide-output/*.json
            iron-tide-output/IRON_TIDE.html
            iron-tide-output/hero-models/
          if-no-files-found: error
      - run: python tests/iron_tide_capture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iron-tide-visual-evidence
          path: iron-tide-output/
          if-no-files-found: error
