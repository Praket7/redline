<!doctype html><html><head><meta charset="utf-8"><title>REDLINE Authority Lab</title><style>body{background:#10141c;color:#eaf0f5;font:16px system-ui;margin:30px}button,input,select{font:inherit;margin:4px;padding:8px}canvas{width:min(900px,100%);background:#202936;border:1px solid #4c5864}pre{white-space:pre-wrap}small{color:#aeb8c2}</style></head><body><h1>REDLINE / Authority Lab</h1><p>Server-owned simulation prototype. Open two tabs, use the same room and course, then start from the first tab.</p><input id="room" value="TEST123"><input id="name" placeholder="Pilot"><select id="course"><option>grand</option><option>iron</option></select><select id="model"><option>kestrel</option><option>blade</option><option>copper</option><option>spirit</option></select><button id="join">Join</button><button id="start">Start</button><p><small>W/S throttle · A/D strafe · ←/→ yaw · ↑/↓ lift · Shift boost · E laser · Space shield · Q EMP. Diagnostic top-down view only, not the full game renderer.</small></p><canvas id="view" width="900" height="650"></canvas><pre id="status"></pre><script>
let ws,id,seq=0,snap,held=new Set();const $=x=>document.getElementById(x),c=$('view'),g=c.getContext('2d');onkeydown=e=>{held.add(e.code);if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault()};onkeyup=e=>held.delete(e.code);onblur=()=>held.clear();$('join').onclick=()=>{ws?.close();ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`);ws.onopen=()=>ws.send(JSON.stringify({op:'join',room:$('room').value,course:$('course').value,model:$('model').value,name:$('name').value||'Pilot'}));ws.onmessage=e=>{const v=JSON.parse(e.data);if(v.type==='joined'){id=v.id;seq=v.ack;}else if(v.type==='snapshot')snap=v;else $('status').textContent=v.message||'';};};$('start').onclick=()=>ws?.send(JSON.stringify({op:'start'}));const h=k=>held.has(k);setInterval(()=>{if(ws?.readyState===1&&id)ws.send(JSON.stringify({op:'input',input:{seq:++seq,throttle:+h('KeyW')-h('KeyS'),strafe:+h('KeyD')-h('KeyA'),steer:+h('ArrowRight')-h('ArrowLeft'),lift:+h('ArrowUp')-h('ArrowDown'),boost:h('ShiftLeft'),fire:h('KeyE'),shield:h('Space'),emp:h('KeyQ')}}));},33);function draw(){g.clearRect(0,0,c.width,c.height);if(snap){const own=snap.players.find(p=>p.id===id),scale=1.3,project=p=>[450+(p[0]-(own?.p[0]||0))*scale,325+(p[2]-(own?.p[2]||0))*scale];for(const p of snap.players){const [x,y]=project(p.p);g.save();g.translate(x,y);g.rotate(-p.yaw);g.fillStyle=p.id===id?'#ed4052':'#6ac8ff';g.beginPath();g.moveTo(0,-11);g.lineTo(8,8);g.lineTo(-8,8);g.fill();if(p.shield){g.strokeStyle='#8efcff';g.beginPath();g.arc(0,0,17,0,Math.PI*2);g.stroke()}g.restore();g.fillStyle='#fff';g.fillText(p.name,x+12,y-10);}for(const e of snap.events.filter(e=>e.type==='laser'&&snap.tick-e.tick<15)){const a=project(e.origin),b=project(e.end);g.strokeStyle='#ff4455';g.lineWidth=2;g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke()}$('status').textContent=`World ${snap.world}\nTick ${snap.tick} · ${snap.players.length} pilots · ${snap.course}\n`+snap.players.map(p=>`${p.name}: ${p.p.map(x=>x.toFixed(1)).join(', ')} · ${p.gates} gates · ack ${p.ack}`).join('\n');}requestAnimationFrame(draw)}draw();</script></body></html>
